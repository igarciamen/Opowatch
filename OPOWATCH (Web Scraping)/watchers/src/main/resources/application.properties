spring.application.name=watchers
server.port=8082

# PostgreSQL BBDD
spring.datasource.url=jdbc:postgresql://localhost:5432/watchersOpoWatch
spring.datasource.username=postgres
spring.datasource.password=apertura15

# Hibernate configuration (database management)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# JWT Security (same secret as users, so tokens issued there are valid here)
jwt.secret=0123456789ABCDEFGHIJKLMNOPQRSTUV


scraper-engine.base-url=http://localhost:8083

users.base-url=http://localhost:8081
notifications.base-url=http://localhost:8084
internal.api-key=change-me-internal-key-2026

watchers.deep-check-enabled=true
watchers.deep-check-max-per-run=15